<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="waterInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Soft background decorative water rings -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="270" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />

  <!-- Main Water Droplet -->
  <g filter="url(#shadow)">
    <path d="M 256 80 
             C 256 80, 140 240, 140 330 
             A 116 116 0 0 0 372 330 
             C 372 240, 256 80, 256 80 Z" 
          fill="url(#dropGrad)" />

    <!-- Inner water liquid fill with wave -->
    <path d="M 152 340 
             C 180 320, 220 360, 256 340 
             C 292 320, 330 350, 360 335
             A 106 106 0 0 1 152 340 Z" 
          fill="url(#waterInner)" opacity="0.85" />

    <!-- Droplet Highlights -->
    <ellipse cx="205" cy="210" rx="18" ry="36" transform="rotate(-30 205 210)" fill="#ffffff" opacity="0.8" />
    <circle cx="202" cy="165" r="7" fill="#ffffff" opacity="0.6" />
    
    <!-- Little bubbles inside droplet -->
    <circle cx="270" cy="370" r="12" fill="#ffffff" opacity="0.5" />
    <circle cx="295" cy="330" r="8" fill="#ffffff" opacity="0.6" />
    <circle cx="240" cy="385" r="7" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- AH20 Badge / Brand pill -->
  <g transform="translate(146, 400)">
    <rect width="220" height="48" rx="24" fill="#ffffff" filter="url(#shadow)" />
    <text x="110" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#6d28d9" text-anchor="middle" letter-spacing="1.5">
      AH20 HAYAT
    </text>
  </g>
</svg>
